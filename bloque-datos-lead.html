<!--
  BLOQUE DE DATOS DEL LEAD — Me Gusta Mi Seguro
  ------------------------------------------------
  Cómo usarlo:
  1. Entra a dashboard.emailjs.com → Email Templates → template_p5pdbve
  2. Cambia el editor al modo código/HTML (icono </> o "Edit Content")
  3. Pega este bloque JUSTO ENCIMA de la firma que ya tienes (la del logo,
     redes sociales, etc.) — no la borres, esta va ANTES.
  4. Guarda y manda un envío de prueba.
-->

<table cellpadding="0" cellspacing="0" border="0" style="font-family: Arial, sans-serif; max-width: 500px;">
  <tr>
    <td style="padding-bottom: 16px;">
      <h2 style="margin: 0; font-size: 20px; color: #073b78;">
        Nueva solicitud recibida
      </h2>
    </td>
  </tr>

  <tr>
    <td style="padding: 16px; background: #f4f6f8; border-radius: 8px;">
      <table cellpadding="0" cellspacing="0" border="0" style="width: 100%; font-size: 14px; color: #333;">
        <tr>
          <td style="padding: 4px 0; width: 120px;"><strong>Nombre:</strong></td>
          <td style="padding: 4px 0;">{{nombre}}</td>
        </tr>
        <tr>
          <td style="padding: 4px 0;"><strong>Teléfono:</strong></td>
          <td style="padding: 4px 0;">{{telefono}}</td>
        </tr>
        <tr>
          <td style="padding: 4px 0;"><strong>Email:</strong></td>
          <td style="padding: 4px 0;">{{email}}</td>
        </tr>
        {{#empresa}}
        <tr>
          <td style="padding: 4px 0;"><strong>Empresa:</strong></td>
          <td style="padding: 4px 0;">{{empresa}}</td>
        </tr>
        {{/empresa}}
        <tr>
          <td style="padding: 4px 0;"><strong>Seguro:</strong></td>
          <td style="padding: 4px 0;">{{seguro}}</td>
        </tr>
        <tr>
          <td style="padding: 4px 0; vertical-align: top;"><strong>Mensaje:</strong></td>
          <td style="padding: 4px 0;">{{mensaje}}</td>
        </tr>
        <tr>
          <td style="padding: 4px 0;"><strong>Página:</strong></td>
          <td style="padding: 4px 0;">{{pagina}}</td>
        </tr>
        <tr>
          <td style="padding: 4px 0;"><strong>Fecha:</strong></td>
          <td style="padding: 4px 0;">{{fecha}}</td>
        </tr>
      </table>
    </td>
  </tr>

  <tr>
    <td style="padding-top: 12px; font-size: 13px; color: #888;">
      Referencia: <strong>{{lead_id}}</strong>
    </td>
  </tr>
</table>
